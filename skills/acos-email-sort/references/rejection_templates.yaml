# Vendor-decline template library for acos-email-sort.
#
# Each entry is a topic name, deterministic match patterns (subject/body
# regexes plus optional sender domains), and an HTML body. `triage.py`
# matches messages IN FILE ORDER and the first match wins, so keep specific
# templates above general ones. `generic_vendor_demo_pitch` is deliberately
# the broadest and is kept LAST; it is also config.json's
# `fallback_decline_topic`, used for anything dropped into `4_autorespond`
# by hand that matches no template at all.
#
# Placeholders, both filled at draft time:
#   {first_name}  the VENDOR's first name. Falls back to "there" when the
#                 sender's display name isn't a person's — a company name,
#                 or something like "Newsletter Team".
#   {signoff}     the mailbox owner's name, from acos-aboutme's profile, or
#                 this skill's local `signature_first_name` when that skill
#                 isn't installed. No person's name is hardcoded in this
#                 file, which is what makes it reusable by anyone.
#
# PROVENANCE — set `provenance:` on every template, including new ones:
#
#   real      Copy from a decline the owner actually sent, reused with the
#             sign-off swapped for {signoff}. A human wrote it and stood
#             behind it, so the wording is proven.
#   drafted   Invented copy written to close a coverage gap. Never sent by a
#             human in this form. Treat the wording and — more importantly —
#             the regex coverage as unproven until it has drafted real
#             replies that were reviewed and sent unedited.
#
# This is the only signal of how far to trust a template before it has a
# track record, so keep it accurate as entries are added. A `drafted`
# template that has proven itself can be promoted to `real`; nothing should
# arrive as `real` that was not actually sent.
#
# ADDING A TEMPLATE — this file is read-only to the skill, and it ships
# inside the packaged skill, so a local edit is overwritten on the next
# upgrade. Submit new templates and pattern fixes to
# techsupport.thesignatry.com; they are incorporated centrally and ship in
# the next release, so one person's coverage gap is closed for everyone.
#
# The signal that one is needed is a cold pitch repeatedly falling through
# to `undetermined`, or repeatedly landing on the fallback topic. The run
# summary surfaces that as a recommendation — it never edits this file, the
# same recommend-never-act rule the skill applies to Outlook rules, and
# decline copy goes out under a person's name, so a human writes it.
#
# New entries start as `provenance: drafted`.
#
# Nothing here is sent automatically. Every draft waits in
# `5_draftsToReview` for a human, and `disclosure_footer` is appended to
# every rendered draft regardless of which template matched.
#
# HTML: plain <p>/<em> only, never a style attribute. The connector's
# outbound sanitizer rejects style=/class=/id= on any tag outright and the
# whole draft creation fails — the attribute is not merely stripped.

disclosure_footer: |
  <p><em>This email was drafted with AI assistance so that every valid email receives a response (we wouldn't want to be ghosted, so this is how I'm keeping up with the volume of emails I receive). I do also want to reassure you that a human has reviewed each and every email and response before it was sent.</em></p>

templates:
  - topic: cybersec_msp_pitch
    provenance: real
    sender_domains: []
    subject_patterns:
      - "\\bmanaged (it )?(&|and)?\\s*cybersecurity\\b"
      - "\\bmanaged security\\b"
      - "\\bsecurity coordination\\b"
      - "\\battack surface\\b"
      - "\\bphishing (risk|resilience)\\b"
      - "\\bcompliance without the chaos\\b"
      - "\\bnetwork monitoring\\b"
    body_patterns:
      - "\\bmanaged (it|security) services?\\b"
      - "\\b(SIEM|SOC|CMMC)\\b"
      - "\\bvulnerabilit(y|ies)\\b"
      - "\\bremediation\\b"
      - "\\baudit readiness\\b"
      - "\\brecompete\\b"
      - "\\bmanaged security service provider\\b"
      - "\\bcyber\\s*security\\b"
    subject_prefix: "Re: "
    html_body: |
      <p>Dear {first_name},</p>
      <p>Thank you for reaching out. We are engaged in a multi-year engagement with a Managed Security Service Provider and do not anticipate re-evaluating the agreement until the summer of 2027. Given that we are not a good prospect for your services at this time, I'm declining the meeting invitation.</p>
      <p>If something changes or I'm looking for a new service - I'll typically post something on LinkedIn and you are welcome to follow me there (<a href="{personal_linkedin_url}">{personal_linkedin_url}</a>).</p>
      <p>- {signoff}</p>

  - topic: contact_list_data_pitch
    provenance: real
    sender_domains: []
    subject_patterns:
      - "\\bcontact list\\b"
      - "\\bemail list\\b"
      - "\\bemails? for outreach\\b"
      - "\\bleads? list\\b"
    body_patterns:
      - "\\bverified list\\b"
      - "\\bvalidated (email )?list\\b"
      - "\\bcomplete contact details\\b"
      - "\\bmarketing outreach\\b"
      - "\\bprospect list\\b"
      - "\\b(excel|csv) file format\\b"
    subject_prefix: "Re: "
    html_body: |
      <p>Dear {first_name},</p>
      <p>I sincerely appreciate your offer; however, we operate in a niche market and do not procure marketing lists. In fact we have a fairly strict OPT-IN only policy for our marketing practices.</p>
      <p>Please remove us from your prospect list.</p>
      <p>Thanks,<br>{signoff}</p>

  - topic: staffing_recruiting_pitch
    provenance: real
    sender_domains: []
    subject_patterns:
      - "\\bstaffing (solutions|partner|services)\\b"
      - "\\brecruit(ing|ment) (services|partner)\\b"
      - "\\bconsultants? (ready|available)\\b"
    body_patterns:
      - "\\bready for their next project\\b"
      - "\\bexploratory conversation\\b"
      - "\\badditional skillsets?\\b"
      - "\\bcontingency (fee|search)\\b"
      - "\\b(bench|available) consultants?\\b"
      - "\\bplace (a )?candidate\\b"
    subject_prefix: "Re: "
    html_body: |
      <p>Dear {first_name},</p>
      <p>Thank you for reaching out. I am not currently interested in your services. We have a very strong referral network and operate in a niche market, so we do not leverage any staffing or recruiting services in our standard practices.</p>
      <p>Any open positions are typically advertised on our <a href="{careers_url}">Careers Page</a> and on <a href="{company_linkedin_url}">LinkedIn</a>. You are welcome to follow any changes there and reach out to our Talent department if you feel that you have a strong candidate.</p>
      <p>{signoff}</p>

  - topic: software_dev_partnership_pitch
    provenance: real
    sender_domains: []
    subject_patterns:
      - "\\bdevelopment partner(ship)?\\b"
      - "\\bstaff augmentation\\b"
      - "\\breduce .*development costs\\b"
    body_patterns:
      - "\\bdedicated development team\\b"
      - "\\badd(ing)? (developers|players) to (your|the) (team|network)\\b"
      - "\\boutsourc(e|ed|ing) (software )?development\\b"
      - "\\b(nearshore|offshore) develop"
      - "\\bin-house vs\\.? agency vs\\.? hybrid\\b"
    subject_prefix: "Re: "
    html_body: |
      <p>Dear {first_name},</p>
      <p>Thank you for reaching out. I have some great development partnerships in place. Right now, I do not have projects that require adding players to our network.</p>
      <p>If something changes - I'll typically post something on LinkedIn and you are welcome to follow me there (<a href="{personal_linkedin_url}">{personal_linkedin_url}</a>).</p>
      <p>- {signoff}</p>

  - topic: nonprofit_outreach_pitch
    provenance: drafted
    sender_domains: []
    subject_patterns:
      - "\\bfor your nonprofit\\b"
      - "\\bfellow .{0,20}nonprofit\\b"
      - "\\bnonprofit disaster aid\\b"
      - "\\bbuilt for nonprofits?\\b"
    body_patterns:
      - "\\bfor your nonprofit\\b"
      - "\\bprepare your nonprofit\\b"
      - "\\bnonprofits? face (these|this)\\b"
    subject_prefix: "Re: "
    html_body: |
      <p>Dear {first_name},</p>
      <p>Thank you for reaching out. We evaluate new vendor relationships internally rather than through cold outreach, and don't have a current need in this area.</p>
      <p>If something changes, I'll typically post something on LinkedIn and you're welcome to follow me there (<a href="{personal_linkedin_url}">{personal_linkedin_url}</a>).</p>
      <p>- {signoff}</p>

  - topic: email_verification_probe
    provenance: drafted
    sender_domains: []
    subject_patterns:
      - "\\bquick check\\b"
    body_patterns:
      - "\\bmaking sure i have the correct email\\b"
      - "\\bconfirm this is the best way to reach you\\b"
      - "\\bcorrect email address for you\\b"
      - "\\bbest way to reach you\\b"
    subject_prefix: "Re: "
    html_body: |
      <p>Dear {first_name},</p>
      <p>Thanks for reaching out, but I don't confirm contact details for unsolicited outreach. Please remove this address from your list.</p>
      <p>{signoff}</p>

  - topic: conference_event_meetup_pitch
    provenance: drafted
    sender_domains: []
    subject_patterns:
      - "\\bwill you be at\\b"
      - "\\bare you attending\\b"
      - "\\bmeet(ing)? up at\\b"
      - "\\bsee you at\\b"
    body_patterns:
      - "\\bare you (planning on |going to be )?attending\\b"
      - "\\bwill you be (at|attending)\\b"
      - "\\bstop by (our|my) booth\\b"
      - "\\bswing by (our|my) booth\\b"
      - "\\bmeet up (at|during) (the )?(conference|summit|event|expo|show)\\b"
      - "\\bconnect in person at (the )?(conference|summit|event|expo|show)\\b"
      - "\\bsee you (there|at (the )?(conference|summit|event|expo|show))\\b"
    subject_prefix: "Re: "
    html_body: |
      <p>Dear {first_name},</p>
      <p>Thank you for the invite — I appreciate you thinking of me, but I won't be attending and won't be able to meet up.</p>
      <p>If something changes, I'll typically post something on LinkedIn and you're welcome to follow me there (<a href="{personal_linkedin_url}">{personal_linkedin_url}</a>).</p>
      <p>- {signoff}</p>

  - topic: generic_vendor_demo_pitch
    provenance: drafted
    sender_domains: []
    subject_patterns:
      - "\\bdemo review\\b"
      - "\\bfree sessions?\\b"
      - "\\bwhy teams choose\\b"
    body_patterns:
      - "\\bquick (walk-?through|demo)\\b"
      - "\\bjust reply (yes|y)\\b"
      - "\\bexploring where it (could|might) support\\b"
      - "\\bsee what'?s possible\\b"
      - "\\bbook a (time|call|demo)\\b"
      - "\\bschedule a (demo|call)\\b"
      - "\\b(15|20|30)[- ]minute call\\b"
    subject_prefix: "Re: "
    html_body: |
      <p>Dear {first_name},</p>
      <p>Thank you for reaching out. We evaluate new vendor relationships internally rather than through cold outreach and don't have a need for this right now.</p>
      <p>If something changes, I'll typically post something on LinkedIn and you're welcome to follow me there (<a href="{personal_linkedin_url}">{personal_linkedin_url}</a>).</p>
      <p>- {signoff}</p>
